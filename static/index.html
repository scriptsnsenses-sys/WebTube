<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YTMusic Player</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" id="brandHome"><span class="logo">♪</span><span>YTMusic<em>player</em></span></a>
  <div class="search-pill">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="q" type="text" placeholder="Search songs, artists, albums, videos…" autocomplete="off" />
    <button id="searchBtn" title="Search">Search</button>
  </div>
  <nav class="topnav">
    <a href="#" id="homeLink">Home</a>
    <a href="/docs" target="_blank">API</a>
  </nav>
</header>

<div class="chips" id="chips">
  <button class="chip active" data-filter="">All</button>
  <button class="chip" data-filter="songs">Songs</button>
  <button class="chip" data-filter="videos">Videos</button>
  <button class="chip" data-filter="albums">Albums</button>
  <button class="chip" data-filter="artists">Artists</button>
  <button class="chip" data-filter="playlists">Playlists</button>
</div>

<main id="main">
  <div id="status"></div>
  <section id="detail"></section>
  <section id="results"></section>
  <section id="home"></section>
</main>

<div id="sheet" class="sheet hidden">
  <div class="sheet-video"><iframe id="ytframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
  <div class="sheet-side">
    <div class="tabs">
      <button id="tabQueue" class="tab active">Up next</button>
      <button id="tabLyrics" class="tab">Lyrics</button>
    </div>
    <div id="upnext" class="pane"></div>
    <pre id="lyrics" class="pane hidden"></pre>
  </div>
</div>

<div id="player" class="player hidden">
  <img id="ptumb" alt="" />
  <div class="p-meta">
    <div id="nowPlaying">Nothing playing</div>
    <div id="nowSub"></div>
  </div>
  <div class="p-btns">
    <button id="watchBtn" title="Show video">▶ Video</button>
    <button id="upnextBtn" title="Queue">☰ Queue</button>
    <button id="lyricsBtn" title="Lyrics">♫ Lyrics</button>
    <button id="hideBtn" title="Close">✕</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
